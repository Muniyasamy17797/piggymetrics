version: '2.1'
services:
  rabbitmq:
    image: rabbitmq:latest
    networks:
      - my-network
    ports:
      - 5672:5672
      - 15672:15672

  config:
    build: config
    networks:
      - my-network
    ports:
      - 8888:8888

  registry:
    build: registry
    networks:
      - my-network

