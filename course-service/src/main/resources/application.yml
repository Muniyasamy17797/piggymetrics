spring:
  application:
    name: course-service
  datasource:
    url: jdbc:postgresql://localhost:5432/lms_courses
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8083

file:
  upload-dir: ${FILE_UPLOAD_DIR:/data/course-content}

eureka:
  client:
    serviceUrl:
      defaultZone: http://registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always