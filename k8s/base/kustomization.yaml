apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
- postgres-deployment.yaml
- redis-deployment.yaml
- rabbitmq-deployment.yaml
- services.yaml

secretGenerator:
- name: postgres-secret
  literals:
  - password=postgres
- name: rabbitmq-secret
  literals:
  - username=guest
  - password=guest